name: Weekly report
on:
  schedule:
    - cron: "0 14 * * 3"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kit/requirements.txt
      - run: pip install -r kit/requirements.txt
      - run: python kit/rating.py
      - run: python kit/settimana.py
      - run: python kit/report.py
      - run: python kit/guida.py
      - run: python kit/sito.py
      - run: python kit/controlli.py
      - name: Publish
        run: |
          git config user.name "Key Numbers"
          git config user.email "338461203+keynumbersnfl-tech@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Weekly report $(date -u +%F)"
          git push
      - name: Announce
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE }}
        run: python kit/annuncia.py report
      - name: Send post text
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_PRIVATA: ${{ secrets.TELEGRAM_PRIVATA }}
        run: test -f data/post_partita.txt && python kit/invia_privato.py data/post_partita.txt || echo "nessun post da inviare"
