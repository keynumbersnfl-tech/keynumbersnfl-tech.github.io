name: Instagram reminders
on:
  schedule:
    - cron: "12 7 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kit/requirements.txt
      - run: pip install -r kit/requirements.txt
      - name: Reminders
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_PRIVATA: ${{ secrets.TELEGRAM_PRIVATA }}
        run: python kit/promemoria.py
