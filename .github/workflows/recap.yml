name: Weekly recap
on:
  schedule:
    - cron: "0 15 * * 2"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kit/requirements.txt
      - run: pip install -r kit/requirements.txt
      - id: build
        run: python kit/consuntivo.py | tee /tmp/out.txt
      - name: Stop if nothing to recap
        run: grep -qE "No completed week|is not finished yet|No snapshot|already published" /tmp/out.txt && echo "SKIP=1" >> $GITHUB_ENV || true
      - if: env.SKIP != '1'
        run: python kit/sito.py
      - if: env.SKIP != '1'
        name: Publish
        run: |
          git config user.name "Key Numbers"
          git config user.email "338461203+keynumbersnfl-tech@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Weekly recap $(date -u +%F)"
          git push
      - if: env.SKIP != '1'
        name: Announce
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE }}
        run: python kit/annuncia.py recap
      - if: env.SKIP != '1'
        name: Send post text
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_PRIVATA: ${{ secrets.TELEGRAM_PRIVATA }}
        run: python kit/invia_privato.py data/post_recap.txt
